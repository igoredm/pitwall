ShortDescription: Lightweight hardware monitor widget for a secondary monitor (FPS, 1% lows, temperatures, clocks), with no game overlay.
Description: |-
  Pitwall shows a hardware-monitor widget on a secondary monitor while you play: FPS, 1% / 0.1% lows, frametime,
  CPU/GPU temperatures (including GPU hot spot and memory junction), clocks, power, RAM and wireless mouse/headset
  battery, plus a CSV log per game session and optional NVIDIA power-limit tuning.
  FPS comes from Windows ETW events via PresentMon, so nothing is injected into the game.
  Runs as administrator (sensors and ETW require it). Bundles PresentMon and installs the PawnIO sensor driver and the
  WebView2 Runtime if missing.
