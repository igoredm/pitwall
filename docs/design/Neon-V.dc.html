<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#00E5FF", "options": ["#00E5FF", "#FF2BD6", "#9DFF3A", "#FFB020"], "section": "Tema"}, "$preview": {"width": 400, "height": 1100}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#00E5FF';
    const rgba = (hex, al) => {
      const s = String(hex).replace('#', '');
      const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s.slice(0, 6);
      const n = parseInt(f, 16);
      if (isNaN(n)) return hex;
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + al + ')';
    };
    return { accent: a, accentSoft: rgba(a, 0.45), accentFaint: rgba(a, 0.16) };
  }
}
