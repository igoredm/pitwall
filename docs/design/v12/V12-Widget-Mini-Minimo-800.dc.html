<style>

body{margin:0}
.D{--bg:#0E1014;--side:#0A0C0F;--sf:#15181D;--sf2:#0F1216;--raise:#1D2128;--segon:#2A2F38;--hair:#23272E;--bd:#30353F;--tx:#ECEEF2;--tx2:#A3AAB6;--tx3:#848C99;--ac:#4C8DFF;--act:#82AEFF;--acs:rgba(76,141,255,.14);--y:#F2B33D;--ys:rgba(242,179,61,.12);--r:#FF6B70;--rs:rgba(255,97,102,.12);--g:#3DDC84;--gs:rgba(61,220,132,.12);--sh:none;--dim:rgba(4,6,9,.70);--knob:#F4F5F7;--pop:#1A1E24;--popsh:0 12px 32px rgba(0,0,0,.5),0 0 0 1px #30353F}
.L{--bg:#F3F4F6;--side:#EAECEF;--sf:#FFFFFF;--sf2:#F0F2F5;--raise:#FFFFFF;--segon:#FFFFFF;--hair:#E3E6EA;--bd:#D2D7DE;--tx:#12151B;--tx2:#4D5562;--tx3:#5F6876;--ac:#2F6FEB;--act:#2257C4;--acs:rgba(47,111,235,.10);--y:#8A5800;--ys:rgba(242,179,61,.18);--r:#C42833;--rs:rgba(209,42,54,.08);--g:#1C8048;--gs:rgba(30,142,79,.10);--sh:0 1px 2px rgba(18,21,27,.07);--dim:rgba(18,21,27,.52);--knob:#FFFFFF;--pop:#FFFFFF;--popsh:0 12px 32px rgba(18,21,27,.16),0 0 0 1px #D2D7DE}
.app{display:flex;position:relative;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.side{width:232px;flex-shrink:0;box-sizing:border-box;background:var(--side);border-right:1px solid var(--hair);padding:14px 12px 12px;display:flex;flex-direction:column;gap:1px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}

.bn{font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.1}
.bv{font-size:11.5px;color:var(--tx3);font-weight:500}
.srch{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:var(--sf);border:1px solid var(--hair);color:var(--tx3);font-size:13px;margin-bottom:6px;box-sizing:border-box}
.srch.on{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs);color:var(--tx)}
.kbd{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:1px 5px;border:1px solid var(--bd);border-radius:4px;color:var(--tx3);line-height:1.4}

.ni svg{color:var(--tx3);flex-shrink:0}
.ni.on{background:var(--raise);color:var(--tx);box-shadow:var(--sh)}
.ni.on svg{color:var(--ac)}
.dot{margin-left:auto;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.upd{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;background:var(--acs);color:var(--tx);text-decoration:none;font-size:12.5px;font-weight:600}
.live{display:flex;flex-direction:column;gap:2px;padding:10px;border-top:1px solid var(--hair);font-size:12px;color:var(--tx2)}

.main{flex:1;min-width:0;box-sizing:border-box;padding:28px 40px 40px;position:relative}

.col.wide{max-width:none}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}

.pd{margin:4px 0 0;color:var(--tx2);font-size:13.5px;max-width:64ch}
.saved{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx3);white-space:nowrap;padding-top:5px}

.sec{margin-top:28px}

.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}

.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}

.p-r{background:var(--rs);color:var(--r)}

.note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13px;line-height:1.45}

.th{font-size:11.5px;font-weight:700;color:var(--tx3)}

.ni{height:34px}

.dl{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:0;font-size:13px}
.dl span{padding:5px 0;border-top:1px solid var(--hair)}
.dl span:nth-child(-n+2){border-top:0}
.dl .k{color:var(--tx2)}

.ev+.ev{border-top:1px solid var(--hair)}
.evn{font-weight:700;font-size:13.5px}
.evs{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--tx3);margin-top:2px}

.cb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.mk{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--tx3)}
.mk b{position:absolute;top:-9px;left:-9px;width:18px;height:18px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);font-weight:600}
.lg i{display:block;width:16px;height:0;border-top:2px solid var(--ac)}

.d-g{color:var(--g);font-weight:700}
.d-r{color:var(--r);font-weight:700}
.d-n{color:var(--tx3);font-weight:600}

.ann{font-size:12px;font-weight:700;color:var(--tx3);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--hair);background:var(--sf);font-size:13px;font-weight:600}


.w{position:relative;overflow:hidden;font-variant-numeric:tabular-nums;box-sizing:border-box;user-select:none}
.w.lumen{--bg:#0A0D13;--text:#F4F6FA;--text2:rgba(228,233,242,.66);--text3:rgba(228,233,242,.44);--surface:rgba(255,255,255,.07);--sb:rgba(255,255,255,.12);--tile:rgba(255,255,255,.05);--track:rgba(255,255,255,.10);--accent:#4C8DFF;--yellow:#FFC53D;--red:#FF6166;--ok:#3DDC84;--wt:rgba(255,197,61,.14);--ct:rgba(255,97,102,.16);--hair:rgba(255,255,255,.08);background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif}

.w .chipg i{display:block;width:.55em;height:.55em;border-radius:50%;background:var(--ok)}

.w .cell.warn{color:var(--yellow);background:var(--wt)}
.w .cell .k{color:var(--text3);font-weight:700;white-space:nowrap}
.w.minimo .cell .k{text-transform:uppercase;letter-spacing:.14em}
.w .cell.crit .k,.w .cell.warn .k{color:inherit;opacity:.85}
