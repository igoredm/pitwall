version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/Pitwall
      - /tests/Pitwall.Tests
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # O Angular fixa a faixa do TypeScript (peer >=6.0 <6.1 no 22.x); sobe junto com o Angular, não sozinho
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
