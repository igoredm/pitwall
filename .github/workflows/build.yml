name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Rust (battery reader)
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          rustup default 1.100.0

      - name: Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $base = ([xml](Get-Content src/Pitwall/Pitwall.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { "$base-ci.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Frontend deps
        working-directory: web
        run: npm ci

      - name: Frontend tests
        working-directory: web
        run: npm test

      - name: Third-party binaries (pinned + verified)
        shell: pwsh
        run: ./installer/fetch-deps.ps1

      - name: Battery reader (Battery Hub, reviewed commit of our fork)
        shell: pwsh
        run: ./installer/build-battery.ps1

      - name: Tests
        run: dotnet test tests/Pitwall.Tests/Pitwall.Tests.csproj -c Release

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.ver.outputs.version }}

      # Assinatura (SignPath Foundation): passo pronto e comentado em docs/signpath.md. Entra aqui, antes dos checksums.

      - name: Checksums
        shell: pwsh
        run: |
          # Quebra de linha LF: o formato do sha256sum (sha256sum -c funciona em qualquer sistema)
          $lines = Get-ChildItem artifacts/installer/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/artifacts/installer/SHA256SUMS.txt", (($lines -join "`n") + "`n"))

      - uses: actions/upload-artifact@v7
        with:
          name: Pitwall-Setup-${{ steps.ver.outputs.version }}
          path: artifacts/installer/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
