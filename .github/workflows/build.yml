name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: MinGW (UCRT)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Frontend deps
        working-directory: web
        run: npm ci

      - name: Third-party binaries (pinned + verified)
        shell: pwsh
        run: ./installer/fetch-deps.ps1

      - name: Battery reader (WirelessBattery from reviewed commit)
        shell: pwsh
        run: |
          $env:PATH = "${{ runner.temp }}\msys64\ucrt64\bin;$env:PATH"
          ./installer/build-battery.ps1

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/installer/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content artifacts/installer/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Pitwall-Setup-${{ steps.ver.outputs.version }}
          path: artifacts/installer/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
